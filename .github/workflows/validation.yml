name: Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # Godot only needs runtime LFS files; docs/art and assets/source are .gdignore'd art/source.
      - name: List runtime LFS files
        run: git lfs ls-files -l --exclude="docs/art/**,assets/source/**" | cut -d' ' -f1 | sort > .lfs-runtime-ids

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-runtime-ids') }}
          restore-keys: lfs-

      - name: Pull runtime LFS files
        run: git lfs pull --exclude="docs/art/**,assets/source/**"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Static project check
        run: python3 tools/validate_project.py

      - name: Native import and parse check
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eiq '(^|[[:space:]])(SCRIPT ERROR|ERROR:|Parse Error)' /tmp/godot-import.log; then
            echo "Godot reported an import or parse error." >&2
            exit 1
          fi

      - name: Runtime smoke check
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=3s 8s godot --headless --path . \
            > >(tee /tmp/godot-runtime.log) 2>&1
          status=$?
          set -e

          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Runtime smoke check exited with status $status." >&2
            exit "$status"
          fi
          if grep -Eiq '(^|[[:space:]])(SCRIPT ERROR|ERROR:|Parse Error)' /tmp/godot-runtime.log; then
            echo "Godot reported a runtime error." >&2
            exit 1
          fi

      - name: Overdrive lifecycle tests
        run: godot --headless --path . tests/TestOverdrive.tscn

      - name: Stability and Verb Expression tests
        run: godot --headless --path . tests/TestStability.tscn

      - name: Trial scoring and resolution tests
        run: godot --headless --path . tests/TestTrialResolution.tscn

      - name: Experiment Protocol tests
        run: godot --headless --path . tests/TestExperimentProtocols.tscn

      - name: Animation adapter tests
        run: godot --headless --path . tests/TestAnimationAdapter.tscn

      # Add focused gameplay test suites as separate steps below.
