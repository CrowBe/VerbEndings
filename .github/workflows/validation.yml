name: Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # Godot only needs runtime LFS files; docs/art and assets/source are .gdignore'd art/source.
      - name: List runtime LFS files
        run: git lfs ls-files -l --exclude="docs/art/**,assets/source/**" | cut -d' ' -f1 | sort > .lfs-runtime-ids

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-runtime-ids') }}
          restore-keys: lfs-

      - name: Pull runtime LFS files
        run: git lfs pull --exclude="docs/art/**,assets/source/**"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Static project check
        run: python3 tools/validate_project.py

      - name: Native import and parse check
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eiq '(^|[[:space:]])(SCRIPT ERROR|ERROR:|Parse Error)' /tmp/godot-import.log; then
            echo "Godot reported an import or parse error." >&2
            exit 1
          fi

      - name: Runtime smoke check
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=3s 8s godot --headless --path . \
            > >(tee /tmp/godot-runtime.log) 2>&1
          status=$?
          set -e

          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Runtime smoke check exited with status $status." >&2
            exit "$status"
          fi
          if grep -Eiq '(^|[[:space:]])(SCRIPT ERROR|ERROR:|Parse Error)' /tmp/godot-runtime.log; then
            echo "Godot reported a runtime error." >&2
            exit 1
          fi

      - name: Overdrive lifecycle tests
        run: godot --headless --path . tests/TestOverdrive.tscn

      - name: Chain Severance tests
        run: godot --headless --path . tests/TestChainSeverance.tscn

      - name: Stability and Verb Expression tests
        run: godot --headless --path . tests/TestStability.tscn

      - name: Trial scoring and resolution tests
        run: godot --headless --path . tests/TestTrialResolution.tscn

      - name: Trial lifecycle tests
        run: godot --headless --path . tests/TestTrialLifecycle.tscn

      - name: Laboratory Entry, Drop, and Recall tests
        run: godot --headless --path . tests/TestLaboratoryTransit.tscn

      - name: Player-facing Trial presentation tests
        run: godot --headless --path . tests/TestTrialPresentation.tscn

      - name: Session diagnostics tests
        run: godot --headless --path . tests/TestSessionDiagnostics.tscn

      - name: Deterministic multiplayer scenario tests
        run: python3 tests/run_multiplayer_scenarios.py --godot godot --seed 24680

      - name: Residual grammar tests
        run: godot --headless --path . tests/TestResidualGrammar.tscn

      - name: Adaptive Containment entry and encounter-tool tests
        run: godot --headless --path . tests/TestAdaptiveContainment.tscn

      - name: Experiment Protocol tests
        run: godot --headless --path . tests/TestExperimentProtocols.tscn

      - name: Experiment Controller tests
        run: godot --headless --path . tests/TestExperimentController.tscn

      - name: Sustained Exposure tests
        run: godot --headless --path . tests/TestSustainedExposure.tscn

      - name: Local playtest bootstrap tests
        run: godot --headless --path . tests/TestLocalPlaytestBootstrap.tscn

      - name: Animation adapter tests
        run: godot --headless --path . tests/TestAnimationAdapter.tscn

      - name: Compound topology and spatial-contract tests
        run: godot --headless --path . tests/TestCompound.tscn

      - name: Facility state ledger tests
        run: godot --headless --path . tests/TestFacilityStateLedger.tscn

      - name: Compound-wide Collapse tests
        run: godot --headless --path . tests/TestCollapseCompound.tscn

      - name: Material Dispenser visual-boundary tests
        run: godot --headless --path . tests/TestMaterialDispenser.tscn

      - name: Compound lifetime and teardown tests
        run: python3 tests/run_compound_lifetime_test.py --godot godot --attempts 2

      - name: Environment kit piece rebuild runner tests
        run: python3 -m unittest tests/test_environment_kit_piece_rebuild_runner.py

      - name: Environment kit piece rebuild tests
        run: >-
          python3 tests/run_environment_kit_piece_rebuild_test.py
          --godot godot --attempts 2 --timeout-seconds 30

      - name: Linux playtest export and launch check
        run: python3 tools/check_export.py --godot godot

      - name: Upload Linux playtest build
        uses: actions/upload-artifact@v4
        with:
          name: VerbEndings-linux-x86_64
          path: build/linux/
          if-no-files-found: error
